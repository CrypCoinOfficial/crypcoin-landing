  <script>
  (function(g){
    // alias global (algunas libs lo usan)
    if(!g.global) g.global = g;
    if(!g.globalThis) g.globalThis = g;

    // polyfill mínimo de process
    if(!g.process){
      var p = g.process = {};
      p.env = p.env || {};
      p.browser = true;
      p.title = 'browser';
      p.version = '';
      p.versions = {};
      p.cwd = function(){ return '/' };
      p.chdir = function(){};
      p.umask = function(){ return 0 };
      p.nextTick = p.nextTick || (g.queueMicrotask
        ? g.queueMicrotask.bind(g)
        : function(cb){ Promise.resolve().then(cb).catch(function(e){ setTimeout(function(){ throw e; },0); }); });
      // no-ops de eventos por compat
      p.on = p.addListener = p.once = p.off = p.removeListener = function(){};
    }
  })(typeof window!=='undefined'?window:self);
  </script>

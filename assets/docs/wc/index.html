<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CrypCoin — WalletConnect Standalone (UniversalProvider)</title>
  <style>
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:#0b0e14;color:#e5e7eb;margin:0;padding:24px;display:flex;justify-content:center}
    .card{width:min(100%,680px);border:1px solid #1f2937;border-radius:12px;padding:16px;background:#0b0e14;box-shadow:0 10px 30px rgba(0,0,0,.25)}
    h2{margin:0 0 8px;font-weight:800}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
    button{padding:10px 14px;border-radius:10px;border:1px solid #111;background:#00a3ff;color:#fff;font-weight:800;cursor:pointer}
    button.secondary{background:#fff;color:#111}
    pre{background:#0f172a;border:1px solid #1f2937;border-radius:10px;padding:10px;white-space:pre-wrap;min-height:140px}
    .hide{display:none}
  </style>
</head>
<body>
  <div class="card">
    <h2>WalletConnect — Standalone</h2>
    <p>Conecta por QR / lista de wallets y muestra la cuenta conectada (Polygon 137).</p>
    <div class="row">
      <button id="btnConnect">Connect with WalletConnect</button>
      <button id="btnDisconnect" class="secondary hide">Disconnect</button>
    </div>
    <pre id="status">Status: preparando…</pre>
  </div>

  <!-- Polyfills mínimos antes de cargar librerías -->
  <script>
    window.global = window.global || window;
    window.globalThis = window.globalThis || window;
    window.process = window.process || {
      env: {}, browser: true, version: '', versions: {},
      nextTick: (cb)=>Promise.resolve().then(cb),
      cwd: ()=>"/", chdir: ()=>{}, umask: ()=>0
    };
    var process = window.process; // identificador global
  </script>

  <!-- Loader robusto: UniversalProvider + Modal + (Buffer opcional) -->
  <script>
    const STATUS = document.getElementById('status');
    const log = (m)=>{ STATUS.textContent = (typeof m==='string'? m : JSON.stringify(m,null,2)); };
    const note = (m)=>{ STATUS.textContent += "\n" + m; };

    // Cambiá el SHA cuando hagas un nuevo commit de estos archivos locales
    const COMMIT_SHA = "292f1866fee2dfa397496f874420c88db804976e";

    const URLS = {
      universal: [
        // LOCAL (subilo a tu repo para evitar CDNs)
        `https://rawcdn.githack.com/CrypCoinOfficial/crypcoin-landing/${COMMIT_SHA}/assets/docs/wc/wc-universal-2.13.0.umd.js`,
        // CDNs oficiales (fallback)
        "https://cdn.jsdelivr.net/npm/@walletconnect/universal-provider@2.13.0/dist/index.umd.js",
        "https://unpkg.com/@walletconnect/universal-provider@2.13.0/dist/index.umd.js"
      ],
      modal: [
        // LOCAL (subilo a tu repo para evitar CDNs)
        `https://rawcdn.githack.com/CrypCoinOfficial/crypcoin-landing/${COMMIT_SHA}/assets/docs/wc/wc-modal-2.6.2.umd.js`,
        // CDNs oficiales (fallback)
        "https://cdn.jsdelivr.net/npm/@walletconnect/modal@2.6.2/dist/index.umd.js",
        "https://unpkg.com/@walletconnect/modal@2.6.2/dist/index.umd.js"
      ],
      buffer: [
        "https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js",
        "https://unpkg.com/buffer@6.0.3/index.min.js"
      ]
    };

    function loadScript(src){
      return new Promise((res, rej)=>{
        const s=document.createElement('script');
        s.src=src; s.async=true;
        s.onload=()=>res(src);
        s.onerror=()=>rej(new Error('network error'));
        document.head.appendChild(s);
      });
    }
    async function loadAny(list, test){
      for(const u of list){
        try{
          log('Cargando: ' + u);
          await loadScript(u);
          if(await test()) { log('OK: '+u); return u; }
          note('↳ loaded pero no expuso el global esperado');
        }catch(e){
          note('↳ fallo: '+e.message);
        }
      }
      throw new Error('all sources failed');
    }

    function getUniversal(){
      const g = window['@walletconnect/universal-provider'];
      return window.UniversalProvider || (g && (g.default || g)) || null;
    }
    function getModalCtor(){
      const g = window['@walletconnect/modal'];
      // algunos builds ponen WalletConnectModal global directo
      return (window.WalletConnectModal && (window.WalletConnectModal.default || window.WalletConnectModal))
           || (g && (g.default || g))
           || null;
    }

    async function ensureBuffer(){
      if (window.Buffer) return;
      await loadAny(URLS.buffer, ()=> !!window.Buffer);
    }

    // Boot: carga UniversalProvider y luego Modal
    (async ()=>{
      try{
        await ensureBuffer(); // por si alguna dep lo pide
        await loadAny(URLS.universal, ()=> !!getUniversal());
        await loadAny(URLS.modal, ()=> !!getModalCtor());
        log('Status: ready — click "Connect with WalletConnect"');
      }catch(e){
        log('❌ No se pudieron cargar las libs: ' + e.message);
      }
    })();
  </script>

  <!-- App (UniversalProvider + Modal) -->
  <script>
    const RPC_HTTP = 'https://polygon-mainnet.g.alchemy.com/v2/It7ghpJe2o8trpFhbDgGzIucMbX-Erzb';
    const WC_PROJECT_ID = 'c264c3eb3939f207e269689e94b7faf5';
    const btnC = document.getElementById('btnConnect');
    const btnD = document.getElementById('btnDisconnect');

    function addr(a){ return a?.slice(0,6)+'…'+a?.slice(-4); }

    btnC.addEventListener('click', async()=>{
      try{
        log('Inicializando WalletConnect…');
        const Universal = getUniversal();
        const ModalCtor = getModalCtor();
        if(!Universal || !ModalCtor) throw new Error('SDKs no disponibles');

        // 1) UniversalProvider (cliente WalletConnect)
        const up = await Universal.init({ projectId: WC_PROJECT_ID });

        // 2) Modal standalone
        const modal = new ModalCtor({
          projectId: WC_PROJECT_ID,
          themeMode: 'dark',
          standaloneChains: ['eip155:137'], // mostramos Polygon
        });

        // 3) Iniciar handshake
        const requiredNamespaces = {
          eip155: {
            chains: ['eip155:137'],
            methods: ['eth_sendTransaction','eth_signTransaction','eth_sign','personal_sign','eth_signTypedData'],
            events: ['chainChanged','accountsChanged'],
          }
        };

        const { uri, approval } = await up.client.connect({ requiredNamespaces });
        if (uri) modal.openModal({ uri });
        const session = await approval();   // usuario acepta en el wallet
        modal.closeModal();

        // 4) Obtener cuentas
        const accounts = session.namespaces.eip155.accounts
          .filter(a=>a.startsWith('eip155:137:'))
          .map(a=>a.split(':')[2]);

        log({ connected:true, chain:'137', accounts });
        btnC.classList.add('hide'); btnD.classList.remove('hide');
      }catch(e){
        console.error(e);
        log('❌ WalletConnect error: ' + (e?.message || e));
      }
    });

    btnD.addEventListener('click', async()=>{
      // UniversalProvider mantiene el client en up.client; para simplicidad,
      // refrescar la página limpia el estado. Si quisieras, podemos añadir up.client.disconnect().
      location.reload();
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CrypCoin — WalletConnect (UniversalProvider)</title>
  <style>
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:#0b0e14;color:#e5e7eb;margin:0;padding:24px;display:flex;justify-content:center}
    .card{width:min(100%,680px);border:1px solid #1f2937;border-radius:12px;padding:16px;background:#0b0e14;box-shadow:0 10px 30px rgba(0,0,0,.25)}
    h2{margin:0 0 8px;font-weight:800}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
    button{padding:10px 14px;border-radius:10px;border:1px solid #111;background:#00a3ff;color:#fff;font-weight:800;cursor:pointer}
    button.secondary{background:#fff;color:#111}
    pre{background:#0f172a;border:1px solid #1f2937;border-radius:10px;padding:10px;white-space:pre-wrap;min-height:140px}
    .hide{display:none}
  </style>
</head>
<body>
  <div class="card">
    <h2>WalletConnect — Standalone</h2>
    <p>Conecta por QR / lista de wallets y muestra la cuenta conectada (Polygon 137).</p>
    <div class="row">
      <button id="btnConnect">Connect with WalletConnect</button>
      <button id="btnDisconnect" class="secondary hide">Disconnect</button>
    </div>
    <pre id="status">Status: preparando…</pre>
  </div>

  <!-- Polyfills mínimos (algunas deps los esperan) -->
  <script>
    window.global = window.global || window;
    window.globalThis = window.globalThis || window;
    window.process = window.process || {
      env: {}, browser: true, version: '', versions: {},
      nextTick: (cb)=>Promise.resolve().then(cb),
      cwd: ()=>"/", chdir: ()=>{}, umask: ()=>0
    };
    (function(){ if(!window.Buffer){ try{ window.Buffer={isBuffer:()=>false,from:(u)=>u,alloc:()=>new Uint8Array(0)}; }catch(e){} }})();
  </script>

  <!-- UMDs que ya subiste a este mismo folder -->
  <script src="./wc-universal-2.13.0.umd.js"></script>
  <script src="./wc-modal-2.6.2.umd.js"></script>

  <script>
    // Detectores de globales (UMD)
    function getUniversal(){
      const g = window['@walletconnect/universal-provider'];
      return window.UniversalProvider || (g && (g.default || g)) || null;
    }
    function getModalCtor(){
      const g = window['@walletconnect/modal'];
      return (window.WalletConnectModal && (window.WalletConnectModal.default || window.WalletConnectModal))
           || (g && (g.default || g))
           || null;
    }

    const STATUS = document.getElementById('status');
    const log = (m)=>{ STATUS.textContent = (typeof m==='string'? m : JSON.stringify(m,null,2)); };

    const WC_PROJECT_ID = 'c264c3eb3939f207e269689e94b7faf5';

    // Mostrar "ready" cuando los scripts ya estén disponibles
    window.addEventListener('load', ()=>{
      const ok = !!getUniversal() && !!getModalCtor();
      log(ok ? 'Status: ready — click "Connect with WalletConnect"' : '❌ SDKs no disponibles');
    });

    let up = null;

    document.getElementById('btnConnect').addEventListener('click', async()=>{
      try{
        const Universal = getUniversal();
        const ModalCtor = getModalCtor();
        if(!Universal || !ModalCtor) throw new Error('SDKs no disponibles');

        // 1) Cliente WalletConnect
        up = await Universal.init({ projectId: WC_PROJECT_ID });

        // 2) Modal (QR / lista de wallets)
        const modal = new ModalCtor({
          projectId: WC_PROJECT_ID,
          themeMode: 'dark',
          standaloneChains: ['eip155:137'],
        });

        // 3) Namespaces requeridos
        const requiredNamespaces = {
          eip155: {
            chains: ['eip155:137'],
            methods: ['eth_sendTransaction','eth_signTransaction','eth_sign','personal_sign','eth_signTypedData'],
            events: ['chainChanged','accountsChanged'],
          }
        };

        // 4) Handshake
        const { uri, approval } = await up.client.connect({ requiredNamespaces });
        if (uri) modal.openModal({ uri });
        const session = await approval();
        modal.closeModal();

        // 5) Cuentas en la chain 137
        const accounts = session.namespaces.eip155.accounts
          .filter(a=>a.startsWith('eip155:137:'))
          .map(a=>a.split(':')[2]);

        log({ connected:true, chain:'137', accounts });
        document.getElementById('btnConnect').classList.add('hide');
        document.getElementById('btnDisconnect').classList.remove('hide');
      }catch(e){
        console.error(e);
        log('❌ WalletConnect error: ' + (e?.message || e));
      }
    });

    document.getElementById('btnDisconnect').addEventListener('click', ()=>{
      // Para simplificar, recargar. Si querés disconnect limpio:
      // up?.client?.disconnect({ topic: up?.session?.topic, reason: { code: 6000, message: 'User disconnected' }});
      location.reload();
    });
  </script>
</body>
</html>
